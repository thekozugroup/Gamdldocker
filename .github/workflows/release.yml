name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: >
          Version to publish, e.g. v2.1.0 (the leading "v" is optional).
          Required for manual runs; ignored on a tag push, where the tag itself
          is the version.
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: downloader/pyproject.toml

      - name: Install the downloader with its dev extras
        run: python -m pip install --upgrade pip && pip install -e "./downloader[dev]"

      - name: Lint
        run: ruff check downloader && ruff format --check downloader

      - name: Test
        run: pytest downloader/tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install the web UI
        working-directory: webui
        run: npm ci

      - name: Type check
        working-directory: webui
        run: npm run typecheck

      - name: Test
        working-directory: webui
        run: npm test

      - name: Build
        working-directory: webui
        run: npm run build

  release:
    name: Build and publish ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gamdl-downloader
            context: .
            file: Dockerfile
          - image: gamdl-webui
            context: ./webui
            file: webui/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version to publish
        id: version
        env:
          # A git ref name can contain shell metacharacters, so it goes through
          # the environment rather than into the script body.
          RAW: ${{ inputs.version || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          raw="$RAW"
          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "'$raw' is not a semver tag (expected vX.Y.Z or vX.Y.Z-suffix)" >&2
            exit 1
          fi
          # A prerelease must never claim :latest or move the :X.Y pointer —
          # someone pulling :latest would silently get a release candidate.
          if [[ "$version" == *-* ]]; then
            prerelease=true
            major_minor=""
          else
            prerelease=false
            major_minor="$(cut -d. -f1-2 <<< "$version")"
          fi
          owner_lc="$(tr '[:upper:]' '[:lower:]' <<< "$OWNER")"
          {
            echo "version=$version"
            echo "major_minor=$major_minor"
            echo "prerelease=$prerelease"
            echo "owner=$owner_lc"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && format('{0}/{1}/{2}:{3}', env.REGISTRY, steps.version.outputs.owner, matrix.image, steps.version.outputs.major_minor) || '' }}
            ${{ steps.version.outputs.prerelease == 'false' && format('{0}/{1}/{2}:latest', env.REGISTRY, steps.version.outputs.owner, matrix.image) || '' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Sigstore-backed provenance recorded on the repo's Attestations tab, in
      # addition to the provenance/SBOM the build step above embeds in the
      # image manifest itself — one is queryable from GitHub, the other travels
      # with the image wherever it's pulled.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
