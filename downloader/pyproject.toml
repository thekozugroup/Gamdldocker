[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamdl-sync"
version = "2.0.0"
description = "Scheduled Apple Music playlist sync built on top of gamdl"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "gamdl>=3.0",
    "mutagen>=1.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
gamdl-sync = "gamdl_sync.__main__:main"

[tool.setuptools.packages.find]
include = ["gamdl_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:gamdl_sync.*"]

[tool.coverage.run]
source = ["gamdl_sync"]
omit = ["gamdl_sync/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # dataclass field defaults read fine here
    "RUF012",  # mutable class attrs are deliberate in the dataclasses
    # The fullwidth lookalikes in naming.py ARE the feature — flagging them as
    # "ambiguous unicode" would mean deleting the thing this project does.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PTH", "N802"]
